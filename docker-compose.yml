version: '3.8'

services:
  # ============================
  # POSTGRES DATABASE
  # ============================
  db:
    image: postgres:15
    container_name: leveling_db
    environment:
      POSTGRES_USER: hunter
      POSTGRES_PASSWORD: arise
      POSTGRES_DB: system_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  # ============================
  # NODE BACKEND API
  # ============================
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: leveling_backend
    environment:
      DATABASE_URL: postgres://hunter:arise@db:5432/system_db
    depends_on:
      - db
    restart: always

  # ============================
  # NGINX (SERVES FRONTEND + PROXIES API)
  # ============================
  reverse-proxy:
    build:
      context: ./frontend
      dockerfile: Dockerfile         # <- Uses the NEW frontend Dockerfile
    container_name: main_proxy

    # Synology: DSM owns ports 80/443 → use 8080 instead
    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
