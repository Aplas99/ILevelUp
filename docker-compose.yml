version: "3.8"

services:
  # ============================
  # POSTGRES DATABASE
  # ============================
  db:
    image: postgres:15
    container_name: leveling_db
    environment:
      POSTGRES_USER: hunter
      POSTGRES_PASSWORD: arise
      POSTGRES_DB: system_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  # ============================
  # NODE BACKEND API
  # ============================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leveling_backend
    environment:
      DATABASE_URL: postgres://hunter:arise@db:5432/system_db
    depends_on:
      - db
    restart: always

  # ============================
  # FRONTEND (Vite Build)
  # ============================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: leveling_frontend
    depends_on:
      - backend
    restart: always

  # ============================
  # NGINX REVERSE PROXY
  # ============================
  reverse-proxy:
    image: nginx:stable-alpine
    container_name: main_proxy

    # IMPORTANT:
    # Synology reserves 80 + 443 → use 8080 instead.
    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      # Certificates ONLY NEEDED later when enabling HTTPS
      - ./nginx/certs:/etc/nginx/certs

    depends_on:
      - frontend
      - backend
    restart: always

volumes:
  postgres_data:
