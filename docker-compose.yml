version: '3.8'

services:
  # 1. The Postgres Database Service
  # This service is only accessible internally by the 'backend'.
  db:
    image: postgres:15
    container_name: leveling_db
    environment:
      POSTGRES_USER: hunter
      POSTGRES_PASSWORD: arise
      POSTGRES_DB: system_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  # 2. The Node.js Backend API Service
  # Accessible internally by the 'reverse-proxy' at 'backend:3000'.
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: leveling_backend
    environment:
      DATABASE_URL: postgres://hunter:arise@db:5432/system_db
    depends_on:
      - db
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules 
    restart: always

  # 3. The React Frontend Service
  # Accessible internally by the 'reverse-proxy' at 'frontend:3000'.
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: leveling_frontend
    depends_on:
      - backend
    restart: always

  # 4. Nginx Reverse Proxy Gateway (The only service exposed to the network)
  reverse-proxy:
    image: nginx:stable-alpine
    container_name: main_proxy
    # Exposes ports 80 and 443 ONLY on the NAS's IP (10.0.0.235)
    ports:
      - "10.0.0.235:80:80"  # HTTP (redirects to HTTPS)
      - "10.0.0.235:443:443" # HTTPS (Secure access point)
    volumes:
      # Mounts the custom routing configuration
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      # Mounts the self-signed certificates
      - ./nginx/certs:/etc/nginx/certs
    restart: always
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data: